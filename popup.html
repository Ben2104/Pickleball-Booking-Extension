<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickleball Booker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --border: rgba(24, 52, 84, 0.1);
      --text: #183454;
      --muted: #5d7085;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --secondary: #eff6ff;
      --secondary-text: #1d4ed8;
      --success-bg: #ecfdf5;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --shadow: 0 18px 34px rgba(24, 52, 84, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
    }

    .shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.4;
      font-size: 13px;
    }

    .content {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input {
      width: 100%;
      border: 1px solid rgba(24, 52, 84, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: #ffffff;
    }

    .input:focus {
      outline: 2px solid rgba(29, 78, 216, 0.16);
      border-color: rgba(29, 78, 216, 0.3);
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-primary {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      box-shadow: 0 10px 22px rgba(15, 118, 110, 0.24);
    }

    .button-secondary {
      color: var(--secondary-text);
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
    }

    .button-subtle {
      color: var(--text);
      background: rgba(241, 245, 249, 0.9);
    }

    .status {
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
      background: rgba(241, 245, 249, 0.9);
      color: var(--text);
    }

    .status[data-tone="success"] {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status[data-tone="error"] {
      background: var(--error-bg);
      color: var(--error-text);
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="content">
      <div>
        <h1>Booking Times</h1>
        <p>Open the page assistant, then enter a booking range and schedule settings in the on-page panel.</p>
      </div>

      <button id="startNow" class="button button-primary">Start Now</button>
      <button id="scheduleBooking" class="button button-secondary">Schedule Booking</button>
      <button id="openPanel" class="button button-subtle">Open Page Panel</button>
      <div id="status" class="status" data-tone="neutral"></div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
